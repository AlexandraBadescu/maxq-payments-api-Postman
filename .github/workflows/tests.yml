name: API tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    name: Suite (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [local-gbp, local-eur]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/run-tests.js --env ${{ matrix.env }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.env }}
          path: reports/

  checks-on-the-tests:
    name: Checks on the tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:isolation
      - run: npm run test:guard
      - run: npm run test:defects
